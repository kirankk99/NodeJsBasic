<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login Page</title>
  <style>
    /* Optional: Add basic styling for a cleaner presentation */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="password"] {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
      margin-bottom: 10px;
      width: 100%; /* Adjust width as needed */
    }
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Login Page</h1>
  <form id="loginForm" onsubmit="return validateUser()">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Login</button>
    <a href="/signup">Sign Up</a>
  </form>
  <div id="errorMessage"></div> <script>
    function validateUser() {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const errorMessageDiv = document.getElementById('errorMessage');

      errorMessageDiv.textContent = ''; // Clear any previous error messages

      // Basic validation (replace with your actual authentication logic)
      if (emailInput.value !== 'kiran@gmail.com' || passwordInput.value !== 'SamplePassword') {
        errorMessageDiv.textContent = 'Invalid email or password.';
        return false; // Prevent form submission if validation fails
      }

      // Successful validation (redirect or handle login on the server-side)
      window.location.href = '/profile';
      return true; // Allow form submission

      // Note: For real-world applications, you'd implement proper authentication
      // using server-side validation and secure password storage (e.g., hashing).
    }
  </script>
</body>
</html>
